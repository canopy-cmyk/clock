name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Guardar log de error en la rama ci-logs
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > errors.log || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/logs && cp build.log errors.log /tmp/logs/
          git fetch origin ci-logs || true
          git checkout --orphan ci-logs-tmp
          git rm -rf . > /dev/null
          cp /tmp/logs/* .
          echo "${GITHUB_SHA}" > commit.txt
          git add build.log errors.log commit.txt
          git commit -m "Log de ${GITHUB_SHA}"
          git push -f origin HEAD:ci-logs

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk clock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: clock-apk
          path: clock.apk

      - name: Publicar en la release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Clock (última compilación)
          prerelease: false
          make_latest: true
          files: clock.apk
          body: "Compilación automática de ${{ github.sha }}"

      - name: Marcar compilación correcta en ci-logs
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          echo "OK ${GITHUB_SHA}" > /tmp/ok.txt
          git checkout --orphan ci-logs-ok
          git rm -rf . > /dev/null
          cp /tmp/ok.txt commit.txt
          git add commit.txt
          git commit -m "OK ${GITHUB_SHA}"
          git push -f origin HEAD:ci-logs
